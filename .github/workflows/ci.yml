name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of the consumer-tested tarball
        value: ${{ jobs.test.outputs.sha256 }}
      version:
        description: Package version in the tested tarball
        value: ${{ jobs.test.outputs.version }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.consumers.outputs.sha256 }}
      version: ${{ steps.consumers.outputs.version }}
    env:
      ENABLE_E2E_HARNESS: '1'
      PUBLIC_E2E_TEST: '1'
      PUBLIC_CONVEX_URL: 'https://placeholder.convex.cloud'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Contract tests
        run: bun run test:contracts

      - name: Unit tests
        run: bun run test:unit

      - name: Package
        run: bun run package

      - name: Production build
        run: bun run build

      - name: SvelteKit 2 and 3 consumers
        id: consumers
        run: node scripts/check-consumers.mjs

      - name: Save the tested npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ steps.consumers.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30
