name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENABLE_E2E_HARNESS: "1"
      PUBLIC_E2E_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Contract tests
        run: bun run test:contracts

      - name: Unit tests
        run: bun run test:unit
